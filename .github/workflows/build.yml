
name: Build Android APK

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable

      - name: Install dependencies
        working-directory: Selling-Mobile-app
        run: flutter pub get

      - name: Build Android APK
        working-directory: Selling-Mobile-app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kwandas-Fresh-Market-APK
          path: Selling-Mobile-app/build/app/outputs/flutter-apk/app-release.apk
